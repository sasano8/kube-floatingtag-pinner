name: e2e

# End-to-end test on a real cluster (kind + a local registry). See test/e2e/run.sh.
#
# SKIPPED BY DEFAULT: the job runs only when the repository variable RUN_E2E is "true"
# (Settings > Secrets and variables > Actions > Variables), or when started by hand
# (Actions > e2e > Run workflow).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    if: ${{ vars.RUN_E2E == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: helm/kind-action@v1.10.0
        with:
          install_only: true # the script creates the cluster itself (it needs the registry wired in)
      - run: go build -o pinner ./cmd/pinner
      - run: test/e2e/run.sh "$PWD/pinner"
